<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Đọc và tải tài liệu Thông tin số ET3250 của Nguyễn Đức Luân.">
    <meta name="theme-color" content="#f5f4ef">
    <title>Thông tin số · ET3250</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "DejaVu Sans", sans-serif;
        color: #202d29;
        background: #f5f4ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      a {
        color: #285e4c;
        text-underline-offset: 4px;
      }

      a:focus-visible {
        outline: 3px solid #a24b20;
        outline-offset: 5px;
      }

      .site-header,
      main {
        width: min(1280px, calc(100% - 48px));
        margin-inline: auto;
      }

      .site-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        padding-block: 20px;
        border-bottom: 1px solid #d8ded5;
        font-size: 14px;
      }

      .course-code {
        color: #202d29;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-decoration: none;
      }

      main {
        margin-block: 28px;
      }

      .document-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-family: "DejaVu Serif", serif;
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 400;
        line-height: 1.3;
      }

      .author {
        margin: 8px 0 0;
        color: #53635a;
        font-size: 14px;
        line-height: 1.6;
      }

      .document-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .button {
        display: inline-flex;
        min-height: 44px;
        justify-content: center;
        align-items: center;
        padding: 12px 18px;
        border: 1px solid #285e4c;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      .button:hover {
        background: #e6ebe2;
      }

      .button-primary {
        color: #fff;
        background: #285e4c;
      }

      .button-primary:hover {
        background: #1d493a;
      }

      .viewer {
        height: calc(100svh - 220px);
        min-height: 560px;
        overflow: hidden;
        border: 1px solid #d8ded5;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 8px 30px rgb(32 45 41 / 5%);
      }

      .viewer object {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .pdf-fallback {
        padding: 32px;
        line-height: 1.8;
      }

      @media (max-width: 600px) {
        .site-header,
        main {
          width: calc(100% - 32px);
        }

        main {
          margin-block: 24px;
        }

        .document-header {
          align-items: flex-start;
        }

        .document-actions {
          width: 100%;
        }

        .button {
          flex: 1;
        }

        .viewer {
          height: 75svh;
          min-height: 440px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="course-code" href="./" aria-label="Trang chủ ET3250">ET3250</a>
      <a href="https://github.com/ndluank69/thong-tin-so-ET3250">Mã nguồn GitHub</a>
    </header>

    <main>
      <section class="document-header" aria-labelledby="document-title">
        <div>
          <h1 id="document-title">Thông tin số</h1>
          <p class="author">Nguyễn Đức Luân</p>
        </div>
        <nav class="document-actions" aria-label="Tài liệu PDF">
          <a class="button button-primary" href="./main.pdf" target="_blank" rel="noopener">Mở PDF</a>
          <a class="button" href="./main.pdf" download="thong-tin-so-ET3250.pdf">Tải PDF</a>
        </nav>
      </section>

      <section class="viewer" aria-label="Đọc tài liệu">
        <object data="./main.pdf#view=FitH" type="application/pdf" aria-label="Tài liệu Thông tin số ET3250">
          <div class="pdf-fallback">
            <p>Mở bản PDF để đọc tài liệu trên trình duyệt của bạn.</p>
            <a href="./main.pdf">Mở tài liệu PDF</a>
          </div>
        </object>
      </section>
    </main>
  </body>
</html>
