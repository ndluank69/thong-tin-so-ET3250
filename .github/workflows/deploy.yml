name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install XeLaTeX and document dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-xetex \
            texlive-latex-extra \
            texlive-science \
            texlive-pictures \
            texlive-fonts-recommended \
            fonts-dejavu-core

      - name: Compile PDF and prepare website
        run: |
          mkdir -p "$RUNNER_TEMP/latex" "$RUNNER_TEMP/pages"
          latexmk -xelatex -interaction=nonstopmode -halt-on-error \
            -file-line-error -outdir="$RUNNER_TEMP/latex" main.tex
          cp index.html "$RUNNER_TEMP/pages/index.html"
          cp "$RUNNER_TEMP/latex/main.pdf" "$RUNNER_TEMP/pages/main.pdf"

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
